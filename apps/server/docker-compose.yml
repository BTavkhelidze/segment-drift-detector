version: '3.9'

services:
  postgress: 
    container_name: segment-prisma-postgres
    image:  postgres:16-alpine
    restart: always

    ports: 
     - '5435:5432'
     
    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}    
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    
    volumes:
      - segment_data:/var/lib/postgresql
    networks:
      - segment-prisma

    healthcheck:
      test: ['CMD-SHELL', "pg_isready -u ${POSTGRES_USER}"]

volumes:
  segment_data:
networks:
  segment-prisma: